# Render Blueprint for development / demo deployment (free plan).
# After the first deploy, adjust the hostnames below if Render assigned different ones.
services:
  - type: web
    name: neighbor-link-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: development
      - key: SERVER_ADDRESS
        value: 0.0.0.0:10000
      - key: DB_PATH
        value: local.db
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://neighbor-link-admin.onrender.com
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: TENANT_PASSWORD
        sync: false

  - type: web
    name: neighbor-link-admin
    runtime: node
    rootDir: admin
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BACKEND_API_URL
        value: https://neighbor-link-backend.onrender.com/api/v1
